version: '3.8'

services:
  fastapi_app:
    build: .
    container_name: factory_hub_api_gateway
    ports:
      - "8000:8000"
    networks:
      - factory_hub_network
    env_file:
      - .env
    volumes:
      - ./app:/app
    restart: always

networks:
  factory_hub_network:
    external: true
